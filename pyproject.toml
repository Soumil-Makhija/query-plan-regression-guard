[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "query-plan-regression-guard"
version = "0.1.0"
description = "Evidence-based PostgreSQL query plan regression checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Soumil Makhija"}]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
plan-guard = "plan_guard.cli:main"

[tool.setuptools.packages.find]
include = ["plan_guard*"]
