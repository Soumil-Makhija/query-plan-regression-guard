[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-plan-regression-guard"
version = "0.1.0"
description = "Evidence-based PostgreSQL query plan regression checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Soumil Makhija"}]
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["plan_guard*"]
